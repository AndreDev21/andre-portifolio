  <div class="boot-terminal">
    <div class="boot-bar">
      <span class="boot-logo" aria-hidden="true"></span>
      <span class="boot-ws is-active">1</span>
      <span class="boot-ws">2</span>
      <span class="boot-ws">3</span>
      <span class="boot-title">andre@arch:~</span>
      <span class="boot-status">bash</span>
    </div>
    <div class="boot-body">
      <div class="boot-log" id="boot-log"></div>
      <div class="boot-input-line">
        <span class="boot-prompt">[andre@arch ~]$</span>
        <span class="boot-cmd" id="boot-cmd"></span>
        <span class="boot-cursor" id="boot-cursor"></span>
      </div>
      <button type="button" class="boot-hint" id="boot-hint">Enter ↵ — bora buildar isso</button>
    </div>
  </div>
</div>
